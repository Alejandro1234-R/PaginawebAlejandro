<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="donde.css">
</head>
<body>
     <!-- Modal: ¿Dónde quieres recibir tus productos? -->
  <div class="modal fade" id="modalEnvio" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="border-radius: 20px;">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 pt-0">
          <div class="text-center mb-4">
            <h2 class="fw-bold">¿Dónde quieres recibir tus productos?</h2>
            <p class="text-muted">Revisa las opciones de envío disponibles.</p>
          </div>
          
          <form id="shippingForm">
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" name="nombre" class="form-control" placeholder="Nombre" required>
              </div>
              <div class="col-md-6">
                <input type="text" name="apellidos" class="form-control" placeholder="Apellidos" required>
              </div>
              <div class="col-md-6">
                <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
              </div>
              <div class="col-md-6">
                <input type="tel" name="telefono" class="form-control" placeholder="Teléfono" required>
              </div>
              <div class="col-md-6">
                <select name="departamento" class="form-select" required>
                  <option selected disabled value="">Elige el departamento</option>
                  <option>Cundinamarca</option>
                  <option>Antioquia</option>
                </select>
              </div>
              <div class="col-md-6">
                <select name="ciudad" class="form-select" required>
                  <option selected disabled value="">Elige la ciudad</option>
                  <option>Bogotá</option>
                  <option>Medellín</option>
                </select>
              </div>
              <div class="col-12">
                <input type="text" name="direccion" class="form-control" placeholder="Dirección completa" required>
              </div>
            </div>

            <div class="payment-box mt-4">
              <h5 class="mb-3"><i class="bi bi-credit-card"></i> Pago</h5>
              <select name="metodo_pago" class="form-select mb-3">
                <option>Nequi</option>
                <option>Daviplata</option>
                <option>Tarjeta de Crédito</option>
              </select>
            </div>

            <button type="submit" class="btn-send mt-4">Guardar y Finalizar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Este es el script para funcionalidad barra de navegación en los celulares-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="carrito.js"></script>
  <script>
    $(document).ready(function () {
      $('#shippingForm').on('submit', function (e) {
        e.preventDefault();
        var formData = $(this).serialize();

        $.ajax({
          type: 'POST',
          url: 'Donde quieres recibir/ajax_donde.php',
          data: formData,
          dataType: 'json',
          success: function (response) {
            if (response.status == 'success') {
              alert(response.message);
              var modalEl = document.getElementById('modalEnvio');
              var modal = bootstrap.Modal.getInstance(modalEl);
              modal.hide();
            }
          },
          error: function () {
            alert("Error al conectar con el servidor.");
          }
        });
      });
    });
  </script>
  
</body>
</html>
