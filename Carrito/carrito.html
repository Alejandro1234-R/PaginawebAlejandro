<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="carrito.css">
  <link rel="stylesheet" href="Donde quieres recibir/donde.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <!--Menu de navegacion-->
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
      <img src="./imagenes/img/Nombre_tienda_virtual-transformed.jpeg" width="40%" height="70px"
        style="display: flex; margin: auto;">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="../login/login.html">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Volver a la tienda</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Mensaje de confirmación -->
  <div id="mensaje-confirmacion" class="alert alert-success"
    style="display: none; position: fixed; top: 20px; right: 20px; z-index: 1000;">
    Producto agregado al carrito.
  </div>

  <div id="carrito" class="container" style="margin-top: 20px;">
    <h2 style="margin-top: 20px;">Productos en el carrito</h2>
    <div class="button-group">
      <button id="vaciar-carrito" class="btn btn-danger">Vaciar carrito</button>
      <button id="compra-ahora" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEnvio">Compra ahora</button>
    </div>
    <div class="table-responsive">
      <table id="lista-carrito" class="table table-striped">
        <thead>
          <tr>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Opcion 1</th>
            <th>Opcion 2</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="lista-carrito-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal: ¿Dónde quieres recibir tus productos? -->
  <div class="modal fade" id="modalEnvio" tabindex="-1" aria-labelledby="modalEnvioLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="border-radius: 20px;">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="modalEnvioLabel">¿Dónde quieres recibir tus productos?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 pt-2">
          <p class="text-muted mb-4">Revisa las opciones de envío disponibles.</p>
          
          <form id="shippingForm">
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" name="nombre" class="form-control" placeholder="Nombre" required>
              </div>
              <div class="col-md-6">
                <input type="text" name="apellidos" class="form-control" placeholder="Apellidos" required>
              </div>
              <div class="col-md-6">
                <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
              </div>
              <div class="col-md-6">
                <input type="tel" name="telefono" class="form-control" placeholder="Teléfono" required>
              </div>
              <div class="col-md-6">
                <select name="departamento" class="form-select" required>
                  <option selected disabled value="">Elige el departamento</option>
                  <option>Cundinamarca</option>
                  <option>Antioquia</option>
                </select>
              </div>
              <div class="col-md-6">
                <select name="ciudad" class="form-select" required>
                  <option selected disabled value="">Elige la ciudad</option>
                  <option>Bogotá</option>
                  <option>Medellín</option>
                </select>
              </div>
              <div class="col-12">
                <input type="text" name="direccion" class="form-control" placeholder="Dirección completa" required>
              </div>
            </div>

            <div class="payment-box mt-4">
              <h5 class="mb-3"><i class="fas fa-credit-card"></i> Método de Pago</h5>
              <select name="metodo_pago" class="form-select mb-3" required>
                <option selected disabled value="">Selecciona un método de pago</option>
                <option>Nequi</option>
                <option>Daviplata</option>
                <option>Tarjeta de Crédito</option>
              </select>
            </div>

            <button type="submit" class="btn-send mt-4">Guardar y Finalizar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!--Script para funcionalidad barra de navegacion-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="carrito.js"></script>
  <script>
    $(document).ready(function () {
      $('#shippingForm').on('submit', function (e) {
        e.preventDefault();
        
        var carrito = localStorage.getItem('carrito');
        if (!carrito || carrito === '[]') {
            alert('El carrito está vacío. Agrega productos antes de comprar.');
            return;
        }

        var formData = $(this).serialize();
        // Agregamos los datos del carrito al string serializado
        formData += '&carrito_datos=' + encodeURIComponent(carrito);

        $.ajax({
          type: 'POST',
          url: '../metodo de pago/procesar_pago.php',
          data: formData,
          dataType: 'json',
          success: function (response) {
            if (response.status == 'success') {
              alert(response.message);
              $('#shippingForm')[0].reset();
              localStorage.removeItem('carrito'); // Limpiamos el carrito tras compra exitosa
              
              var modalEl = document.getElementById('modalEnvio');
              var modal = bootstrap.Modal.getInstance(modalEl);
              modal.hide();

              // Redirigir a la factura
              window.location.href = '../metodo de pago/factura.php?id=' + response.id_pedido;
            } else {
              alert(response.message);
            }
          },
          error: function () {
            alert("Error al conectar con el servidor.");
          }
        });
      });
    });
  </script>
</body>

</html>
